name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: "Production build (--production)"
        type: boolean
        default: true
      release:
        description: "Create a GitHub Release from this run"
        type: boolean
        default: false
      version:
        description: "Release tag (e.g. v2.1.7). Default: v<project version>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: false

env:
  PRODUCTION: ${{ github.event.inputs.production || 'true' }}

jobs:
  # ---------------------------------------------------------------------------
  # Windows (MSYS2 UCRT64)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        # setup-msys2 registers this shell; a bare "msys64" is not a valid
        # Actions shell and makes the whole workflow fail validation.
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkg-config
            curl
            tar
            zip
            unzip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            echo "ISCC found"
          } else {
            Write-Warning "ISCC not found; the installer step will be skipped"
          }

      - name: Verify toolchain
        run: |
          meson --version
          ninja --version
          cmake --version
          gcc --version

      - name: Build + package
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            bash application/scripts/package.sh --production
          else
            bash application/scripts/package.sh
          fi
          echo "=== application/dist ==="
          ls -lh application/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcode-windows-x86_64
          path: application/dist/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Linux + macOS (native runs)
  # ---------------------------------------------------------------------------
  unix:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-15-intel, arch: x86_64 }
          - { os: macos-latest, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc pkg-config cmake \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev \
            libxi-dev libxtst-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev \
            dpkg-dev wget zip curl tar

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja cmake pkg-config

      - name: Verify toolchain
        run: |
          meson --version
          ninja --version
          cmake --version
          echo "arch: ${{ matrix.arch }}"

      - name: Build + package
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            bash application/scripts/package.sh --production
          else
            bash application/scripts/package.sh
          fi
          echo "=== application/dist ==="
          ls -lh application/dist

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          bash application/scripts/package-appimage.sh --nobuild \
            --builddir build --distdir application/dist
          ls -lh application/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcode-${{ runner.os }}-${{ matrix.arch }}
          path: application/dist/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS universal binary (lipo) + DMG
  # ---------------------------------------------------------------------------
  darwin_universal:
    name: macOS universal
    needs: [unix]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dmgbuild
        run: |
          pipx install dmgbuild \
            || python3 -m pip install --user --break-system-packages dmgbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tcode-macOS-*
          path: artifacts

      - name: Create universal binary + packages
        run: |
          set -euo pipefail

          VERSION="$(sed -n "s/.*version : '\([^']*\)'.*/\1/p" meson.build | head -1)"
          REF="tcode-${VERSION}"
          X86="$PWD/artifacts/tcode-macOS-x86_64"
          ARM="$PWD/artifacts/tcode-macOS-aarch64"
          DIST="$PWD/application/dist"
          mkdir -p "$DIST" work/portable-x86 work/portable-arm work/bundle-x86 work/bundle-arm

          tar -xzf "$X86/${REF}-x86_64-darwin-portable.tar.gz" -C work/portable-x86
          tar -xzf "$ARM/${REF}-aarch64-darwin-portable.tar.gz" -C work/portable-arm
          tar -xzf "$X86/${REF}-x86_64-darwin-bundle.tar.gz" -C work/bundle-x86
          tar -xzf "$ARM/${REF}-aarch64-darwin-bundle.tar.gz" -C work/bundle-arm

          # --- portable ---
          mkdir -p universal-portable
          cp -a "work/portable-arm/tcode" "universal-portable/tcode"
          lipo -create \
            "work/portable-x86/tcode/tcode" \
            "work/portable-arm/tcode/tcode" \
            -output "universal-portable/tcode/tcode"
          tar -C universal-portable -czf "$DIST/${REF}-universal-darwin-portable.tar.gz" tcode

          # --- app bundle ---
          mkdir -p universal-bundle
          cp -a "work/bundle-arm/T Code.app" "universal-bundle/T Code.app"
          lipo -create \
            "work/bundle-x86/T Code.app/Contents/MacOS/tcode" \
            "work/bundle-arm/T Code.app/Contents/MacOS/tcode" \
            -output "universal-bundle/T Code.app/Contents/MacOS/tcode"
          tar -C universal-bundle -czf "$DIST/${REF}-universal-darwin-bundle.tar.gz" "T Code.app"

          # --- dmg ---
          export PATH="$HOME/.local/bin:$PATH"
          dmgbuild -s application/resources/macos/tcode-dmg.py \
            -D "app_path=universal-bundle/T Code.app" \
            "T Code" "$DIST/${REF}-universal-darwin.dmg"

          lipo -archs "universal-portable/tcode/tcode"
          lipo -archs "universal-bundle/T Code.app/Contents/MacOS/tcode"
          ls -lh "$DIST"

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcode-darwin-universal
          path: application/dist/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # GitHub Release (tag push, or workflow_dispatch with release=true)
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [windows, unix, darwin_universal]
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tcode-*
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            VERSION="$(sed -n "s/.*version : '\([^']*\)'.*/\1/p" meson.build | head -1)"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: T Code ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/tcode-*
